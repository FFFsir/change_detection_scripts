      12），档间等值线边界可开关（默认开启）；固定模式使用全量程（非负 `[0,1]`、带符号
      `[-1,1]`），动态模式使用与阈值量程一致的自适应上界 `x`（非负 `[0,x]`、带符号
      `[-x,x]`）；色条同步显示离散档位与量程端点；色阶只影响显示，不改变阈值、超阈值统计与量程；二值掩膜模式不绘制档间边界线（其余两种模式按开关生效）。
