    reason:
      text: COMBOS (app/change_detection_webui.py:380-384) 三项经真实浏览器切换 6 次：页面 marker
        存活、navigation 条目恒为 1（无刷新）；控件显隐按类型切换（同通道 视图/帧对；同日 A/B/共享帧；跨日
        A/B/A帧/B帧/残差方向/残差取值）；热力图 src 逐次变化；gallery
        2→1（“同一观测，两通道”）→2；统计与语义提示同步更新；同日下 landsat A/B 切跨日会自动纠正为同传感器 sentinel2
        视图。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：同日跨通道结果可由独立 numpy 复算逐像素复现（d=(1-cos)/2），且与数据集自带 C0 数值呈严格 2 倍关系。
    result: passed
    reason:
      text: pair_distance (230-254) 与独立 numpy 最大差 4.9e-8~1.3e-7；同日基线热力图（掩膜开/关）与独立
        colourise((1-cos)/2) 逐像素 0 差异；C0_epoch_0/d ratio
        ∈[1.9999992,2.0000011]、C1_visible_before_ir_after/d
        ∈[1.9999988,2.0000011]（6 组）；源码无 C0_epoch/C1_/same_modality 读取，仅取
        common_mask；UI 同日统计 0.2267/0.3328/0.4789 与复算 0.226735/0.332761/0.478853
        一致。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：跨日跨通道的残差等于“跨日期距离 − 对应同日基线”逐像素成立；双向结果与规格中的对称化公式一致。
    result: passed
    reason:
      text: compute (576-600) 的 base/fwd/rev/sym 与独立复算 max|Δ|≤1.4e-7（C01
