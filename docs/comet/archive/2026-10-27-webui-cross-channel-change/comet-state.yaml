        0-2、掩膜 413↔16384 且灰块消失）。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：8 个单期 Landsat 瓦片（C05/C06/C10/C12/C17/C18/C19/C21）在跨日类型下不出现不可算组合；V01
      中间帧（2024-09-01）缺图提示正确区分“索引无记录”。
