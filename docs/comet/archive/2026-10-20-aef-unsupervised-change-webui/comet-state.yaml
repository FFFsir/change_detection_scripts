acceptance:
  - id: A1
    source: brief.md
    text: A1：启动应用后，默认加载一个瓦片与视图，页面同时呈现该 view 两帧之间的变化热力图，以及与这两帧日期对应的 gallery 图像。
    result: passed
    reason:
      text: 重载后默认 C01/sentinel2_full，热力图 128x128，两张 gallery 图与日期 2024-02-29 ->
        2024-11-30 同时呈现。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：热力图颜色由 `d = (1 - cos) / 2` 计算，取值与像素级计算一致，范围为 `[0, 1]`；任意像素的计算结果与直接用
      numpy 对嵌入向量求 `1 - dot` 再除以 2 得到的值一致。
    result: passed
    reason:
      text: 独立 numpy 复算 d=(1-cos)/2，像素级 RGB 校验和完全一致；中位数/p95/最大值为 0.0579/0.1738/0.3366
        与独立计算一致。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：页面上存在一个阈值控件，其量程为 `(0, x]`：`x` 由当前图像对自动计算并满足"阈值等于 `x` 时高于阈值的像素数为
      0"，左端无法取到 `0`（最小值为一个步长）。拖动后无需刷新页面即可看到高于阈值的像素在热力图上被高亮，且滑块到顶时高亮数恰为 0。
    result: passed
    reason:
      text: 修复字符串 props 根因后真实鼠标拖动全程可用：C01 拖到 0.188496 得 605/15971 与独立复算一致；到顶 0.339966
        得 0/15971；到左端 0.003366 得 15971/15971（不为 0）；拖动后无 JS 异常、body 无
        no-pointer-events，下拉与开关仍可点击。C02/C11 及 C11 nir 小量程同样通过。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：页面显示当前阈值下高于阈值的像素数量与占比，数值随阈值变化实时更新。
    result: passed
    reason:
      text: 统计实时显示超阈值数与占比，C11 nir 关闭掩膜后 0.041->0.02009 的像素差异恰为 54，与统计及二值模式下红色像素数一致。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：切换瓦片或视图后，热力图与 gallery 图像同步更新，且显示的图像日期与该 view 所比较的两帧日期一致。
    result: passed
    reason:
      text: C01->C02->C11 量程重算为 0.339966/0.296637/0.141198，默认值
        0.299574/0.146850/0.069900 与独立复算一致；gallery 文件名与日期同步；视图
        sentinel2_full->sentinel2_nir 量程重算且滑块仍可拖动。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：对于 `frames > 2` 的 V01，可以选择不同的帧对；选择变化后热力图随之更新。
    result: passed
    reason:
      text: V01 提供 3 个帧对选项，默认 0->2；切换后量程/默认值/热力图更新（131->142 超阈值，独立复算一致）；中间帧缺图按规格提示。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：页面提供 `common_mask` 开关，默认开启。开启时掩膜外像素在热力图中显示为中性灰且不计入统计；关闭后全部 16384
      个像素都按距离着色并计入统计，热力图上不再出现中性灰块，统计分母随之从有效像素数变为全部像素数。切换开关无需刷新页面即可看到结果变化。
    result: passed
    reason:
      text: 默认开启掩膜；关闭后 16384 像素全部参与、灰色块为 0、分母变为 16384；重新开启恢复（C01 413、C11 nir 7660
        灰色像素），且开启后再次拖动成功。
      truncated: false
