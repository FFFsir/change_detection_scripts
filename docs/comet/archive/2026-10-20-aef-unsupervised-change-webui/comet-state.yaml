  summary:
    text: 阈值量程改为按图像对自适应且左开 (0, x]。threshold_scale() 计算 step≈max/100（下限 1e-4）、upper
      取严格大于 max 的最小 step 整数倍、lower=step（阈值永不为 0）、decimals 由 step 推导、默认阈值 x>=0.30
      取 0.30 否则 x/2 并对齐步长。rescale() 在切换瓦片/视图/帧对/掩膜开关时重算量程，整个控件更新块在 syncing
      守卫内完成，避免 Number.sanitize 把旧阈值写回状态。本轮另修正 rescale 中重复的 set_label 调用。距离色阶仍固定
      [0,1] 与量程解耦。
    truncated: false
